<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency SOS | Patient</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .nav { background: rgba(255,255,255,0.2); padding: 12px 24px; border-radius: 50px; display: inline-block; margin-bottom: 20px; }
        .nav a { color: white; text-decoration: none; margin: 0 15px; font-weight: 500; }
        .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .card { background: white; border-radius: 24px; padding: 28px; box-shadow: 0 20px 35px rgba(0,0,0,0.2); }
        .sos-card { text-align: center; background: linear-gradient(135deg, #ff416c, #ff4b2b); color: white; }
        .sos-btn { background: white; border: none; color: #ff416c; font-size: 32px; font-weight: 800; padding: 20px 40px; border-radius: 60px; cursor: pointer; margin: 20px 0; transition: 0.3s; }
        .sos-btn:hover { transform: scale(1.05); }
        .status { background: rgba(255,255,255,0.2); padding: 15px; border-radius: 16px; margin: 20px 0; }
        .chat-area { height: 400px; display: flex; flex-direction: column; }
        .messages { flex: 1; overflow-y: auto; margin-bottom: 16px; padding: 10px; background: #f9f9ff; border-radius: 16px; }
        .message { margin: 8px 0; padding: 8px 14px; border-radius: 20px; max-width: 80%; }
        .user-msg { background: #667eea; color: white; align-self: flex-end; margin-left: auto; }
        .bot-msg { background: #e9ecef; color: #1a1a2e; }
        .chat-input { display: flex; gap: 12px; }
        .chat-input input { flex: 1; padding: 12px; border: 2px solid #e0e0e0; border-radius: 32px; }
        .chat-input button { background: #667eea; color: white; border: none; padding: 0 24px; border-radius: 32px; cursor: pointer; }
        #map { height: 300px; margin-top: 20px; border-radius: 20px; }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
    </style>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDEmS46Yt8rcRYUyRBJBAdFsejtuKW4XKQ&libraries=places"></script></head>
<body>
<div style="text-align: center;">
    <div class="nav">
        <a href="/">🏠 Patient</a>
        <a href="/driver">🚑 Driver Dashboard</a>
    </div>
</div>
<div class="container">
    <div class="card sos-card">
        <h2>🚨 EMERGENCY SOS</h2>
        <p>Tap for immediate ambulance dispatch</p>
        <button class="sos-btn" id="sosButton">📞 SOS</button>
        <div class="status" id="statusArea">
            <strong>Status:</strong> <span id="statusText">Ready</span>
        </div>
        <div id="map"></div>
        <div class="info-text" style="margin-top:12px; opacity:0.9;">📍 Your live location will be shared</div>
    </div>
    <div class="card">
        <h2>🤖 AI First-Aid Assistant</h2>
        <div class="chat-area">
            <div class="messages" id="chatMessages">
                <div class="message bot-msg">👋 Hello! Describe the emergency (bleeding, chest pain, choking, etc.)</div>
            </div>
            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="e.g., severe bleeding..." />
                <button id="sendChat">Send</button>
            </div>
        </div>
    </div>
</div>
<script>
    let map, patientMarker, currentPosition = null;
    function getLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(showPosition, showError);
        } else {
            document.getElementById("statusText").innerText = "Geolocation not supported";
        }
    }
    function showPosition(position) {
        currentPosition = { lat: position.coords.latitude, lng: position.coords.longitude };
        initMap(currentPosition.lat, currentPosition.lng);
    }
    function showError(error) {
        console.warn(error);
        document.getElementById("statusText").innerText = "Location access denied. Using default.";
        currentPosition = { lat: 12.9716, lng: 77.5946 };
        initMap(currentPosition.lat, currentPosition.lng);
    }
    function initMap(lat, lng) {
        const location = { lat: lat, lng: lng };
        map = new google.maps.Map(document.getElementById("map"), { zoom: 14, center: location });
        patientMarker = new google.maps.Marker({ position: location, map: map, title: "You are here", icon: { url: "http://maps.google.com/mapfiles/ms/icons/red-dot.png" } });
    }
    document.getElementById("sosButton").addEventListener("click", async () => {
        if (!currentPosition) { alert("Waiting for location..."); return; }
        const sosBtn = document.getElementById("sosButton");
        sosBtn.disabled = true;
        sosBtn.innerText = "🚑 Dispatching...";
        document.getElementById("statusText").innerText = "Contacting central hub...";
        try {
            const response = await fetch("/api/sos", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ lat: currentPosition.lat, lng: currentPosition.lng })
            });
            const data = await response.json();
            if (response.ok) {
                document.getElementById("statusText").innerHTML = `✅ Ambulance ${data.ambulance_name} dispatched!<br>🚑 ETA: calculating...`;
                new google.maps.Marker({ position: { lat: data.ambulance_lat, lng: data.ambulance_lng }, map: map, title: data.ambulance_name, icon: { url: "http://maps.google.com/mapfiles/ms/icons/blue-dot.png" } });
                const directionsService = new google.maps.DirectionsService();
                const directionsRenderer = new google.maps.DirectionsRenderer();
                directionsRenderer.setMap(map);
                directionsService.route({ origin: { lat: data.ambulance_lat, lng: data.ambulance_lng }, destination: currentPosition, travelMode: google.maps.TravelMode.DRIVING, drivingOptions: { trafficModel: google.maps.TrafficModel.BEST_GUESS } }, (result, status) => { if (status === "OK") directionsRenderer.setDirections(result); });
            } else {
                document.getElementById("statusText").innerText = "❌ " + data.error;
            }
        } catch (err) { document.getElementById("statusText").innerText = "Network error"; }
        finally { sosBtn.disabled = false; sosBtn.innerText = "📞 SOS"; }
    });
    async function sendMessage() {
        const input = document.getElementById("chatInput");
        const msg = input.value.trim();
        if (!msg) return;
        appendMessage(msg, "user-msg");
        input.value = "";
        const res = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: msg }) });
        const data = await res.json();
        appendMessage(data.response, "bot-msg");
    }
    function appendMessage(text, className) {
        const msgsDiv = document.getElementById("chatMessages");
        const div = document.createElement("div");
        div.className = `message ${className}`;
        div.innerText = text;
        msgsDiv.appendChild(div);
        msgsDiv.scrollTop = msgsDiv.scrollHeight;
    }
    document.getElementById("sendChat").addEventListener("click", sendMessage);
    document.getElementById("chatInput").addEventListener("keypress", (e) => { if (e.key === "Enter") sendMessage(); });
    getLocation();
</script>
</body>
</html>
